<title>Weekend Menu | Angela's Eats</title>

<style>
* {

html,
body {

}

.hotspot:focus-visible {

/* TOP NAVIGATION */
.home {
  left: 36%;
  top: 5.5%;
  width: 7%;
  height: 6%;
}

.about {
  left: 43.2%;
  top: 5.5%;
  width: 7%;
  height: 6%;

.menu {
  left: 50.3%;
  top: 5.5%;
  width: 7%;
  height: 6%;
}

.contact {
  left: 57.6%;
  top: 5.5%;
  width: 8%;
  height: 6%;
}

/* TOP CALL BUTTON */
.call-top {
  left: 74%;
  top: 3.7%;
  width: 14%;
  height: 8.7%;
}

/* BOTTOM ORDER BUTTONS */
.call-bottom {
  left: 38.6%;
  top: 89.8%;
  width: 16%;
  height: 5.7%;
}

.text-bottom {
  left: 55.8%;
  top: 89.8%;

  height: 5.7%;
}

.email-bottom {
  left: 70.4%;
  top: 89.8%;
  width: 15.7%;
  height: 5.7%;
}

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0,0,0,0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

@media (max-width:700px) {
  body {
    align-items: flex-start;
  }
}
</style>
</head>

<body>

<main
